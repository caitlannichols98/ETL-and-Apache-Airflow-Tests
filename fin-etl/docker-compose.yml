services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: CHANGE_ME_STRONG
      POSTGRES_DB: market
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl -d market -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # pick one of the env setups below; env_file must point to the compose variant
    env_file:
      - etl.env
    command: ["python", "-m", "app.etl"]
    # If you ever need the host gateway on Linux, uncomment the extra_hosts line
    # extra_hosts:
    #   - "host.docker.internal:host-gateway" im putting this here since it is struggling to connect

volumes:
  pgdata:
